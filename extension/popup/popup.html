<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Enhance Spreadsheet</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Enhance Spreadsheet</h1>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </header>

    <div class="settings">
      <div class="setting-item">
        <span class="label" id="label-language">言語</span>
        <select id="language-select" class="dropdown">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="pt-BR">Português (Brasil)</option>
        </select>
      </div>

      <div class="setting-item">
        <span class="label" id="label-highlight">行列ハイライト</span>
        <label class="switch">
          <input type="checkbox" id="highlight-toggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <span class="label" id="label-style">ハイライトの種類</span>
        <select id="highlight-style" class="dropdown">
          <option value="line" id="option-line">線 (Line)</option>
          <option value="cell" id="option-cell">セル全体 (Cell)</option>
        </select>
      </div>

      <div class="setting-item">
        <span class="label" id="label-row-limit">行ハイライトの限界</span>
        <label class="switch">
          <input type="checkbox" id="row-limit-toggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <span class="label" id="label-col-limit">列ハイライトの限界</span>
        <label class="switch">
          <input type="checkbox" id="col-limit-toggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item">
        <span class="label" id="label-range-highlight">範囲選択時のハイライト</span>
        <label class="switch">
          <input type="checkbox" id="range-highlight-toggle">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="setting-item" id="thickness-container">
        <span class="label"><span id="label-thickness">線の太さ</span> <span id="thickness-value">2px</span></span>
        <input type="range" id="line-thickness" min="1" max="12" value="2">
      </div>

      <div class="setting-item">
        <span class="label" id="label-color">ハイライト色</span>
        <input type="color" id="highlight-color" value="#ffff00">
      </div>

      <div class="setting-item">
        <span class="label"><span id="label-opacity">透明度</span> <span id="opacity-value">20%</span></span>
        <input type="range" id="highlight-opacity" min="0" max="100" value="20">
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
